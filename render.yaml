services:
  - type: web
    name: theraum-as-system
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
    envVars:
      - key: MANAGER_PASSCODE
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      # 무료(Free) 플랜은 로컬 디스크가 슬립/재배포마다 초기화되므로,
      # 아래 두 값을 설정하면 앱이 자동으로 Turso(무료 영구 DB)를 사용합니다.
      # 값을 비워두면 로컬 SQLite로 동작하되 데이터가 유실될 수 있습니다.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
# 참고: 무료(Free) 플랜은 Persistent Disk를 지원하지 않으므로 disk 설정은 사용하지 않습니다.
# (데이터 보존은 TURSO_DATABASE_URL/TURSO_AUTH_TOKEN 환경변수로 처리)
